repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]
      - id: check-foundation-files
        name: Check conflict markers and accidental environment files
        entry: python scripts/check_repository.py
        language: system
        pass_filenames: true

