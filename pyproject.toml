[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = [".tools", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config -ra"
markers = ["integration: requires live Redis and a Celery worker in addition to PostgreSQL"]
filterwarnings = ["error", "ignore:.*pkg_resources.*:DeprecationWarning"]

[tool.coverage.run]
source = ["backend/apps", "backend/config"]
omit = ["*/migrations/*", "*/wsgi.py", "*/asgi.py"]

[tool.coverage.report]
show_missing = true

