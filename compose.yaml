name: interview-platform

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: development
  env_file: .env
  environment: &backend-environment
    DJANGO_SETTINGS_MODULE: config.settings.development
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  volumes:
    - ./backend:/app/backend
  init: true

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine3.22
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=10)"]
      interval: 15s
      timeout: 12s
      start_period: 20s
      retries: 5

  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=INFO, --concurrency=2, --hostname=worker@%h]
    stop_grace_period: 130s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination "worker@$${HOSTNAME}" --timeout 3 | grep -q pong']
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 5

  test:
    <<: *backend
    profiles: [test]
    environment:
      <<: *backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.testing
      COVERAGE_FILE: /tmp/.coverage
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: [python, -m, pytest, -m, 'not integration', --cov, --cov-report=term-missing]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

