name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: interview_platform
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U interview -d interview_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-alpine3.22
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DATABASE_URL: postgresql://interview:ci-only-password@127.0.0.1:5432/interview_platform
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py spectacular --file schema.yaml --validate --fail-on-warn
      - run: python -m pytest -m 'not integration' --cov --cov-report=xml:reports/coverage.xml
      - name: Start real Celery worker
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=config.settings.development DJANGO_SECRET_KEY=ci-only-unused-development-key celery -A config worker --loglevel=INFO --concurrency=1 > ../celery-ci.log 2>&1 &
          echo $! > ../celery-ci.pid
      - run: python -m pytest -m integration
      - name: Stop worker
        if: always()
        run: |
          if [ -f celery-ci.pid ]; then kill "$(cat celery-ci.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results-${{ matrix.python-version }}
          path: |
            reports/
            schema.yaml
            celery-ci.log

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare disposable environment
        run: |
          cp .env.example .env
          python -c "from pathlib import Path; import secrets; p=Path('.env'); p.write_text(p.read_text().replace('replace-with-a-random-local-key-before-running', secrets.token_hex(32)).replace('replace-with-a-random-local-database-password', secrets.token_hex(24)))"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240 api worker
      - run: docker compose exec -T api python manage.py check
      - run: docker compose --profile test run --rm test
      - run: docker compose --profile test run --rm test python -m pytest -m integration
      - name: Collect diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
